<script>
// 画面いっぱいに地図を出す。31px は上下の余白（8px×2）と地図ツールが地図の下に空ける15px、40px は上部バー（common.css の .totk-bar）の分
var MAP_HEIGHT = 'calc(100vh - 31px - 40px)';
// 下メニューの並び。1つ目はいつも見えている段、2つ目以降は左端の「表示設定」で上に開いたときに出る段（地図ツールの決まりで4つまで）。
// スマホ幅で1段に並ぶのは6種類まで。7種類以上の組は、ツールが半分ずつの2段に分ける（1つ目の組は分けると2段目が隠れるので6種類まで）。
// 1つ目と2つ目の段は、左端にボタン（表示設定・全てOFF）を置く分だけ common.css で左を空けている
var MENU_GROUPS = [
  { typeNames: ['hokora', 'hokorachallenge', 'tower', 'cave', 'well', 'korok'] },
  { subject: '施設・地底', typeNames: ['village', 'stables', 'dungeon', 'root', 'hole'] },
  { subject: 'ボス', typeNames: ['hinokkusu', 'iwarokku', 'ierokku', 'iwa_oct', 'block', 'frox', 'gurioku', 'lynel', 'morudora', 'phantom', 'koga', 'boss_temple'] },
];
// メニューを閉じているときに、地図の下へ隠れている分の高さ（px）。開いたメニューの高さは、これに見えている1段分（62px）を足したもの。
// いまの中身（ボタン4段と見出し2つ）がちょうど収まる値にしている。段を増減したら合わせて変える。
// 必ず8の倍数にすること。ツールはメニューを8pxずつ動かし、ちょうど0にならないと止まらない
var MENU_HIDE_HEIGHT = 200;
// 開いた直後に表示する種類
var DEFAULT_ON_TYPES = ['hokora', 'tower'];
// 同時に表示できる種類の数。ピンを出しすぎて動きが重くならないようにしている
var MAX_SHOWN_TYPES = 5;
// 検索の一覧に出す種類。名前が1つずつ違う種類だけにしている（コログは名前が無く、ボスや深穴は同じ名前がいくつも並ぶ）
var SEARCH_TYPES = ['hokora', 'hokorachallenge', 'tower', 'cave', 'well', 'village', 'stables', 'dungeon', 'root'];

// 地図の上に短いお知らせを出す。全画面表示でも見えるよう、地図（#RenderMap）の中に置く
function showNotice(text) {
  var $notice = $('.totk-notice');
  if (!$notice.length) $notice = $('<div class="totk-notice"></div>').appendTo('#RenderMap');
  $notice.text(text).addClass('totk-is-shown');
  clearTimeout(showNotice.timer);
  showNotice.timer = setTimeout(function () { $notice.removeClass('totk-is-shown'); }, 2500);
}

// 開いたメニューの高さを中身に合わせる。ツールの既定は390pxで、段が少ないと下が空いたまま地図を隠す。
// 起動オプションでは変えられないので、ツールが下メニューを作る前に、メニュー部品（Leaflet の SlideMenu）の既定値を書き換える
function fitMenuHeight() {
  var options = L.Control.SlideMenu.prototype.options;
  options.hideHeight = MENU_HIDE_HEIGHT + 'px';
  options.height = (MENU_HIDE_HEIGHT + parseInt(options.showHeight, 10)) + 'px';
}

// 地図の操作部品を下側に集める（スマホを持った手の指が届くように）。地図ツールは置き場所を選べないので、作られた後で移す。
// ツールは下側の部品を、スマホ幅では「左下に境界線・地図の切り替え、右下に進捗」、PC幅ではその左右逆に置く。
// どちらでも同じ並びになるよう、角を決め打ちせずに「境界線の上」「進捗の隣」を目印にしている
function moveControlsToBottom() {
  // 拡大縮小と全画面は、境界線・地図の切り替えと同じ列の上へ。同じ列に入れるので、境界線が出ない地図（空島・地底）でも間が空かない
  $('.leaflet-map-border-switch').before($('.leaflet-control-zoom, .leaflet-control-fullscreen'));
  // 検索欄は、進捗の隣（地図の中央寄り）へ。横に並べる指定は common.css（.totk-bottom-row）
  var $progress = $('.leaflet-checker-progress');
  var $search = $('.leaflet-keyword-search-ui').parent().addClass('totk-search');
  var $corner = $progress.parent().addClass('totk-bottom-row');
  if ($corner.hasClass('leaflet-right')) $progress.before($search);
  else $progress.after($search);
}

function showLimitNotice() {
  showNotice('同時に表示できるのは' + MAX_SHOWN_TYPES + '種類までです');
}

function shownTypeCount() {
  return $('.leaflet-side-marker-switch-ui input:checked').length;
}

// 上限を超えてONにしようとしたら取り消す。click を取り消すとチェックが元に戻り、地図ツールの処理（change）も走らない。
// メニューの中のクリックは外へ伝わらない（Leaflet が止めている）ので、document ではなくボタン1つずつに付ける
function limitShownTypes() {
  $('.leaflet-side-marker-switch-ui input').on('click', function (event) {
    // この時点で、押したボタン自身はもうON（checked）として数えられている
    if (this.checked && shownTypeCount() > MAX_SHOWN_TYPES) {
      event.preventDefault();
      showLimitNotice();
    }
  });
}

// 地図ツールの検索は、選んだピンへ地図を動かすだけで種類のON/OFFは変えない。OFFの種類だとピンが見えないままなので、
// 選んだピンの種類をONにする（上限に達しているときはONにせず、お知らせを出す）
function showTypeOnSearch() {
  $(document).on('change', '#JsWKSUPinSelect', function () {
    var id = this.value;
    var pin = window._pinDatas.filter(function (d) { return d.id === id; })[0];
    if (!pin) return;
    var $switch = $('#leaflet-side-switch-button-' + pin.type);
    if ($switch.prop('checked')) return;
    if (shownTypeCount() >= MAX_SHOWN_TYPES) return showLimitNotice();
    $switch.prop('checked', true).trigger('change');
  });
}

// GitHub の保存データを読み終えてから地図ツールを起動する。先に起動すると古いチェック状態で描かれる
$(function () {
  TotkSave.ready.then(function () {
    var menuTypes = MENU_GROUPS.reduce(function (types, group) { return types.concat(group.typeNames); }, []);
    fitMenuHeight();
    $.fn.leafletArticleMapToolV3({
      pinDatas: window._pinDatas,
      mapDatas: window._mapDatas,
      typeDatas: window._typeDatas,
      saveKeyName: 'ZeldaTotkMap',
      baseArticleUrl: 'https://gamewith.jp/zelda-totk/article/show/',
      baseGachaUrl: 'https://img.gamewith.jp/article_tools/zelda-totk/gacha/',
      defaultMapId: '地上',
      enableChecker: true,
      isHideAllButton: true,
      defaultOffTypes: menuTypes.filter(function (type) { return DEFAULT_ON_TYPES.indexOf(type) === -1; }),
      noSetViewOnChangeMap: true,
      noMarkerLastPositionTypes: ['hokorachallenge'],
      height: MAP_HEIGHT,
      pcHeight: MAP_HEIGHT,
    })
      .KeywordSearchUI({ targetTypes: SEARCH_TYPES })
      .TotkSideMenu(MENU_GROUPS)
      .CheckerProgress('hokora');
    moveControlsToBottom();
    limitShownTypes();
    showTypeOnSearch();
  });
});
</script>
